; Supervisor config — chạy queue worker persistent cho lara-scrm.
; Copy file này vào /etc/supervisor/conf.d/lara-scrm-queue.conf trên server,
; sửa path + user cho khớp môi trường, rồi:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start lara-scrm-queue:*
;
; Verify: sudo supervisorctl status lara-scrm-queue:*
; Log: tail -f storage/logs/queue.log
;
; Lý do: QUEUE_CONNECTION=database. Không có worker → import 15 lead treo mãi.
; Trước đây chạy `php artisan queue:work --stop-when-empty` bằng tay — tắt SSH là chết.

[program:lara-scrm-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /home/sweetsic/public_html/data.sweetsica.com/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --backoff=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=sweetsic
numprocs=1
redirect_stderr=true
stdout_logfile=/home/sweetsic/public_html/data.sweetsica.com/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
